[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyapy-allisony"
version = "1.2.0.dev0"
description = "Lyman-alpha reconstruction models and inference tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Allison Youngblood", email = "allison.a.youngblood@nasa.gov"},
]
keywords = ["astronomy", "lyman-alpha", "spectroscopy", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=6,<8",
    "corner>=2.2,<3",
    "emcee>=3.1,<4",
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "mpmath>=1.3,<2",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
jax = ["jax==0.12.0.1"]
inference = [
    "jax==0.12.0.1",
    "numpyro==0.22.0",
    "dynesty==3.2.0",
]

[project.urls]
Homepage = "https://github.com/allisony/lyapy"
Issues = "https://github.com/allisony/lyapy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lyapy = ["*.dat", "*.xl_stis"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
